name: Build VORTEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync web assets
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-AI-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk VORTEX-AI.apk
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" VORTEX-AI.apk --title "VORTEX AI APK build ${{ github.run_number }}" --notes "Debug APK built from commit ${{ github.sha }}" --latest
